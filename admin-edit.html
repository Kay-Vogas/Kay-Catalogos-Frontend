<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css"> 
    <link rel="stylesheet" href="/css/style-game-adm.css"> 
    
    <title>Editar Jogo - Admin</title>

</head>
<body>

    <header>
        <h1>Catálogo de Games</h1>

        <a href="pageGamesAdm.html" class="admin-link-btn">
            Área do Administrador ⚙️
        </a>
    </header>

    <main>
        <a href="index.html" class="back-link">&larr; Voltar ao Painel</a>

        <div class="admin-form-container">
            <h2>Editar Jogo</h2>

            <form id="edit-form">
                <input type="hidden" id="game-id" name="id">

                <div class="form-group">
                    <label for="title">Título:</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="year">Ano de Lançamento:</label>
                    <input type="number" id="year" name="year" min="1970" max="2099" step="1" required>
                </div>

                <div class="form-group">
                    <label for="genre">Gênero:</label>
                    <input type="text" id="genre" name="genre" required>
                </div>

                <div class="form-group">
                    <label for="platforms">Plataformas:</label>
                    <input type="text" id="platforms" name="platforms" placeholder="Ex: PC, Console, Mobile" required>
                </div>

                <div class="form-group">
                    <label for="score">Nota (Score):</label>
                    <input type="number" id="score" name="score" min="0" max="10" step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="img_url">URL da Imagem:</label>
                    <input type="url" id="img_url" name="img_url" required>
                </div>

                <div class="form-group">
                    <label for="short_description">Descrição Curta:</label>
                    <textarea id="short_description" name="short_description" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="long_description">Descrição Completa:</label>
                    <textarea id="long_description" name="long_description" rows="8"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="admin-btn save">Salvar Alterações</button>
                    <a href="index.html" class="admin-btn cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/admin-edit.js"></script>
</body>
</html>
